name: Build Sonify APK

on:
  workflow_dispatch:
  push:
    branches: [ 'coo1-bottom-bar' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROID_HOME="$SDK"
          echo "sdk.dir=$SDK" > local.properties
          SDKMANAGER="$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")"
          yes 2>/dev/null | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          for p in "platform-tools" "platforms;android-37" "build-tools;37.0.0"; do
            "$SDKMANAGER" "$p" > /dev/null 2>&1 || echo "skip $p"
          done
          ls "$SDK/platforms" || true

      - name: chmod gradlew
        run: chmod +x gradlew

      - name: Build Release
        run: >
          ./gradlew :app:assembleRelease
          --parallel
          --build-cache
          --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sonify-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish Release (每次构建独立发布，不覆盖)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sonify build ${{ github.run_number }}
          body: |
            自动构建产物（不覆盖历史版本）
            - commit: ${{ github.sha }}
            - run: ${{ github.run_id }}
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Debug (未混淆，用于读取崩溃堆栈)
        run: >
          ./gradlew :app:assembleDebug
          --parallel
          --build-cache
          --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sonify-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
